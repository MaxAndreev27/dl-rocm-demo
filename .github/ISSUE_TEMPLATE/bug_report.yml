name: Bug report
description: Report a reproducible problem with the demo.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, check that the issue has not already been reported.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command or notebook steps and any relevant input.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, GPU model, Python, PyTorch, and ROCm/HIP versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste relevant logs, removing credentials or other sensitive information.
      render: text
    validations:
      required: false
